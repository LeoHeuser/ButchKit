name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs the suite through this before it tags, on the commit it will tag.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

concurrency:
  # Called from Release, github.workflow is "Release", so that run and the push run on main
  # do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner with the newest Xcode, where "latest" is tested. Today only the xcode-27 preview
  # image has Xcode 27, iOS 27 and macOS 27. Switch to macos-latest once GitHub ships Xcode 27 in
  # a regular image and retires the preview label.
  LATEST_RUNNER: xcode-27

jobs:
  versions:
    name: Versions
    runs-on: macos-26
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: matrix
        run: |
          matrix=$(Scripts/ci-matrix.sh)
          echo "$matrix" | jq -r '.[] | .name + " on " + .runner'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Package.swift is swift-tools-version 6.2, so the newest Xcode on the image is selected.
      # macos-15 would otherwise build with its default Xcode 16.4.
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: macOS version
        if: matrix.platform == 'macos'
        run: sw_vers
      - name: Build
        if: matrix.platform == 'macos'
        run: swift build
      - name: Test
        if: matrix.platform == 'macos'
        run: swift test

      # Runner images carry only some simulator runtimes, and device names change with every
      # runtime. The requested runtime is downloaded when missing, and an iPhone is created on it.
      - name: Simulator
        if: matrix.platform == 'ios'
        id: simulator
        run: |
          want="${{ matrix.version }}"
          runtime() {
            xcrun simctl list runtimes available -j | jq -c --arg v "$want" '
              [.runtimes[] | select(.platform == "iOS")
                | select($v == "latest" or .version == $v or (.version | startswith($v + ".")))]
              | sort_by(.version | split(".") | map(tonumber)) | last // empty'
          }
          found=$(runtime)
          if [ -z "$found" ]; then
            if [ "$want" = latest ]; then
              xcodebuild -downloadPlatform iOS
            else
              xcodebuild -downloadPlatform iOS -buildVersion "$want"
            fi
            found=$(runtime)
          fi
          if [ -z "$found" ]; then
            echo "::error::No iOS $want simulator runtime available. Installed:"
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Testing on $(echo "$found" | jq -r .name)"
          udid=$(xcrun simctl create "CI iPhone" \
            "$(echo "$found" | jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')" \
            "$(echo "$found" | jq -r .identifier)")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # The scheme reports TEST SUCCEEDED with "Executed 0 tests" because the suite is
      # swift-testing and the XCTest counter stays at zero. The swift-testing run is the real one
      # and fails the job on its own, so the count below is checked rather than trusted.
      - name: Test on simulator
        if: matrix.platform == 'ios'
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ButchKit \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            | tee xcodebuild.log
          grep -qE "Test run with [1-9][0-9]* tests .* passed" xcodebuild.log \
            || { echo "::error::No swift-testing run reported; the suite did not execute."; exit 1; }

  # A log line that carries an error's prose lands in the diagnostics file users share. The rule is
  # in Documentation/LoggingStrategy.md; the script is the one place it is checked.
  log-privacy:
    name: Log privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: Scripts/check-log-privacy.sh

  # The one check the main ruleset requires. The test jobs are named after the matrix, which moves
  # with Package.swift and the runner images, so requiring them by name would block every pull
  # request once a name changes. The log privacy check joins in here for the same reason.
  passed:
    name: CI passed
    needs: [test, log-privacy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "${{ needs.test.result }}" == success && "${{ needs.log-privacy.result }}" == success ]]'
