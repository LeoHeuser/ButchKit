name: Release

# Started by Scripts/git-hooks/post-merge when a version branch is merged into
# main, or by hand with "Run workflow". Tags and publishes only once build and
# tests passed on macOS and iOS. Every job checks out the commit main pointed at
# when the run started, so a later push cannot slip an untested state into the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 2.0.24
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/check-version.sh "${{ inputs.version }}"

  test:
    name: Test
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag and publish
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: Scripts/release.sh "${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
